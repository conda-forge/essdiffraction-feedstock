context:
  name: essdiffraction
  version: "26.6.1"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/essdiffraction-${{ version }}.tar.gz
  sha256: ae97f1769a4a3d29679773eeacda85a4d70bda5833e20782009efc0bfd5b9658

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - setuptools-scm >=8.0
    - pip
  run:
    - python >=${{ python_min }}
    - dask-core >=2022.1.0
    - essreduce >=26.6.0
    - python-graphviz
    - ncrystal >=4.1.0
    - ncrystal-extra >=4.1.0
    - numpy >=2
    - plopp >=25.5.0
    - pythreejs >=2.4.1
    - sciline >=25.04.1
    - scipp >=25.11.0
    - scippneutron >=26.3.0
    - scippnexus >=23.12.0
    - spglib >=2.0.0,!=2.7
    - tof >=25.12.0

tests:
  - python:
      imports:
        - ess.diffraction
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Diffraction data reduction for the European Spallation Source
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/scipp/ess/tree/main/packages/essdiffraction
  homepage: https://scipp.github.io/ess/diffraction/

extra:
  recipe-maintainers:
    - MridulS
    - conda-forge/scipp
